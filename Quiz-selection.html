<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Baloo 2',cursive;
    margin:0;
    text-align:center;
    background: linear-gradient(135deg,#89f7fe,#66a6ff);
}

/* Header */

header{
    background: linear-gradient(90deg,#ff9a9e,#4facfe);
    padding:20px;
    color:white;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

header h1{
    margin:0;
}

/* Container */

.container{
    margin-top:70px;
}

h2{
    font-size:2rem;
    margin-bottom:40px;
}

/* Quiz cards */

.quiz-grid{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.quiz-card{
    width:250px;
    padding:30px;
    border-radius:25px;
    background:white;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    cursor:pointer;
    transition:all 0.25s ease;
    position:relative;
}

/* Hover animation */

.quiz-card:hover{
    transform:translateY(-10px) scale(1.05);
}

/* Icon */

.quiz-icon{
    font-size:70px;
    margin-bottom:15px;
    animation: float 3s ease-in-out infinite;
}

/* Floating animation */

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

.quiz-title{
    font-size:1.5rem;
    margin-bottom:10px;
}

.quiz-desc{
    font-size:1rem;
    color:#555;
}

/* Colors */

.basic{
    border-top:8px solid #56ab2f;
}

.jumbled{
    border-top:8px solid #ff512f;
}

</style>
</head>

<body>

<header>
<h1>Quiz de Français</h1>
</header>

<div class="container">

<h2>Choose Your Quiz</h2>

<div class="quiz-grid">

<!-- BASIC WORDS -->

<div class="quiz-card basic" onclick="location.href='quiz.html'">

<div class="quiz-icon">📚</div>

<div class="quiz-title">Basic Words</div>

<div class="quiz-desc">
Learn common French vocabulary and meanings.
</div>

</div>

<!-- JUMBLED SENTENCES -->

<div class="quiz-card jumbled" onclick="location.href='quiz-sentences.html'">

<div class="quiz-icon">🧩</div>

<div class="quiz-title">Jumbled Sentences</div>

<div class="quiz-desc">
Rearrange the words to build the correct sentence.
</div>

</div>

</div>

</div>

</body>
</html>
