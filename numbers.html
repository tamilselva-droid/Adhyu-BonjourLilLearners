<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers - Learn French</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4facfe;
            --secondary: #ff9a9e;
            --accent: #ffe259;
            --dark: #333;
            --card-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            margin: 0;
            font-family: 'Baloo 2', cursive;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            min-height: 100vh;
            text-align: center;
        }

        /* Header layout matching Greetings.html */
        header {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            padding: 20px 15px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            flex: 1;
        }

        /* Standardized CTA button */
         .cta {
				  display: inline-block;
				  margin-top: 20px;
				  background: linear-gradient(90deg, #ff512f, #dd2476);
				  color: #fff;
				  padding: 10px 30px;
				  border-radius: 50px;
				  font-size: 1.1rem;
				  text-decoration: none;
				  box-shadow: 0 12px 25px rgba(0,0,0,0.3);
				  transition: transform 0.2s ease;
		}

		.cta-home {
		            background: linear-gradient(90deg, #107CFE, #4facfe);
		        }

		.cta:hover {
		            transform: scale(1.05);
		        }

		header .cta + .cta {
		    margin-left: 10px;
}

        .container {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .word-container {
            display: grid;
            /* Auto-fit handles the layout based on screen width */
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .word-box {
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .word-box:hover {
            background-color: #fff;
            transform: translateY(-5px);
            border-color: var(--secondary);
            color: #dd2476;
        }

        .translation {
            font-size: 16px;
            color: #666;
            font-weight: 500;
            margin-top: 5px;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .cta { padding: 8px 15px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<header>

    <a href="index.html" class="cta cta-home">⬅ Back to Home</a>
	    <h1>Nombres en français</h1>
	    <a href="Numbers-quiz.html" class="cta">Take Quiz 🚀</a>
    <a href="Numbers-Game.html" class="cta">Play Game 🎲</a>
</header>

<div class="container">
    <div class="word-container">
        <div class="word-box" onclick="playAudio('N1')">Un <span class="translation">One</span></div>
        <div class="word-box" onclick="playAudio('N2')">Deux <span class="translation">Two</span></div>
        <div class="word-box" onclick="playAudio('N3')">Trois <span class="translation">Three</span></div>
        <div class="word-box" onclick="playAudio('N4')">Quatre <span class="translation">Four</span></div>
        <div class="word-box" onclick="playAudio('N5')">Cinq <span class="translation">Five</span></div>
        <div class="word-box" onclick="playAudio('N6')">Six <span class="translation">Six</span></div>
        <div class="word-box" onclick="playAudio('N7')">Sept <span class="translation">Seven</span></div>
        <div class="word-box" onclick="playAudio('N8')">Huit <span class="translation">Eight</span></div>
        <div class="word-box" onclick="playAudio('N9')">Neuf <span class="translation">Nine</span></div>
        <div class="word-box" onclick="playAudio('N10')">Dix <span class="translation">Ten</span></div>
    </div>
</div>

<script>
    function playAudio(word) {
        const audio = new Audio("Audio/Numbers/" + word + ".mp3");
        audio.play().catch(e => console.log("Audio file not found: " + word + ".mp3"));
    }
</script>

</body>
</html>
