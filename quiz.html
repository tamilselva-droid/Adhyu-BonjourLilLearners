<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Greetings Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4facfe;
            --secondary: #ff9a9e;
            --accent: #ffe259;
            --dark: #333;
        }

        body {
            margin: 0;
            font-family: 'Baloo 2', cursive;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            min-height: 100vh;
            text-align: center;
        }

        /* Header layout matching Index and Greetings */
        header {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            padding: 20px 15px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            flex: 1;
        }

        /* CTA button style from Index */
        .cta {
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: #fff;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
            white-space: nowrap;
        }

        .cta:hover {
            transform: scale(1.05);
        }

        .container {
            padding: 40px 20px;
            max-width: 600px;
            margin: auto;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .question {
            font-size: 26px;
            margin-bottom: 25px;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 15px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .option:hover {
            background-color: #e3f2fd;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .correct {
            background-color: #22A699 !important;
            color: white;
            border-color: #22A699 !important;
        }

        .feedback-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .try-again-btn, .continue-btn {
            font-family: 'Baloo 2', cursive;
            font-size: 1.1rem;
            padding: 10px 25px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            color: white;
            transition: opacity 0.2s;
        }

        .try-again-btn { background-color: #5da1d7; }
        .continue-btn { background-color: #f18738; }

        .disabled { pointer-events: none; }

        /* Spacer for header balance */
        .nav-spacer { width: 160px; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="cta">⬅ Back to Home</a>

    <div id="wrong-answer-feedback" class="feedback-container" style="display: none;">
        <h2 style="color: #dd2476;">Oops, try again! 💡</h2>
        <div class="feedback-buttons">
            <button onclick="tryAgain()" class="try-again-btn">Try again</button>
            <button onclick="continueQuiz()" class="continue-btn">Skip Question</button>
        </div>
    </div>
</div>

    function getRandomQuestions() {
        const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, 5);
    }

    let questions = getRandomQuestions();
    let currentQuestion = 0;
    let correctAnswers = 0;

    function loadQuestion() {
        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const feedbackEl = document.getElementById("feedback");

        feedbackEl.textContent = '';
        document.getElementById('wrong-answer-feedback').style.display = 'none';
        questionEl.textContent = questions[currentQuestion].question;
        optionsEl.innerHTML = '';

        questions[currentQuestion].options.forEach((option, index) => {
            const optionEl = document.createElement("div");
            optionEl.classList.add("option");
            optionEl.textContent = option;
            optionEl.onclick = () => handleAnswer(index);
            optionsEl.appendChild(optionEl);
        });
    }

    function handleAnswer(selected) {
        const feedbackEl = document.getElementById("feedback");
        const correctOption = questions[currentQuestion].correct;
        const optionsEl = document.getElementById("options").children;

        for (let option of optionsEl) { option.classList.add("disabled"); }

        if (selected === correctOption) {
            optionsEl[selected].classList.add("correct");
            correctAnswers++;
            feedbackEl.style.color = "green";
            feedbackEl.innerHTML = 'Magnifique! Correct! 🎉';
            setTimeout(nextQuestion, 900);
        } else {
             feedbackEl.style.color = "red";
						feedbackEl.innerHTML = 'Oops, Wrong Answer! 💡';

            setTimeout(nextQuestion, 900);
        }
    }

    function tryAgain() {
        document.getElementById('wrong-answer-feedback').style.display = 'none';
        const optionsEl = document.getElementById("options").children;
        for (let option of optionsEl) { option.classList.remove("disabled"); }
    }

    function continueQuiz() {
        nextQuestion();
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            window.location.href = `results.html?correctAnswers=${correctAnswers}&totalQuestions=${questions.length}`;
        }
    }

    window.onload = loadQuestion;
