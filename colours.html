<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours - Learn French</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4facfe;
            --secondary: #ff9a9e;
        }

        body {
            font-family: 'Baloo 2', cursive;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ffffff; /* Page background set to white */
        }

        /* Header layout matching Greetings.html */
        header {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            padding: 20px 15px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            flex: 1;
        }

        /* Standardized CTA buttons from Greetings */
       .cta {
		  display: inline-block;
		  margin-top: 20px;
		  background: linear-gradient(90deg, #ff512f, #dd2476);
		  color: #fff;
		  padding: 10px 30px;
		  border-radius: 50px;
		  font-size: 1.1rem;
		  text-decoration: none;
		  box-shadow: 0 12px 25px rgba(0,0,0,0.3);
		  transition: transform 0.2s ease;
}

.cta-home {
            background: linear-gradient(90deg, #107CFE, #4facfe);
        }

        .cta:hover {
            transform: scale(1.05);
        }

header .cta + .cta {
    margin-left: 10px;
}
        .container {
            padding: 40px 20px;
            max-width: 1100px;
            margin: auto;
        }

        .word-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Original word-box base styles */
        .word-box {
            padding: 30px 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .word-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }

        /* Preserved original box colors */
        .rouge { background-color: #ff0000; }
        .bleu { background-color: #0000ff; }
        .vert { background-color: #008000; }
        .jaune { background-color: #ffff00; color: black; }
        .orange { background-color: #ffa500; }
        .noir { background-color: #000000; }
        .blanc { background-color: #FFFDD0; color: black; border: 1px solid #ddd; }
        .rose { background-color: #ff69b4; }
        .violet { background-color: #8a2be2; }
        .marron { background-color: #8b4513; }

        .translation {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 500;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .cta { padding: 8px 15px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<header>

	<a href="index.html" class="cta cta-home">⬅ Back to Home</a>
    <h1>Couleurs en français</h1>
    <a href="Colours-quiz.html" class="cta">Take Quiz 🚀</a>
    <a href="Colours-Game.html" class="cta">Play Game 🎲</a>

</header>

<div class="container">
    <div class="word-container">
        <div class="word-box rouge" onclick="playAudio('C1')">Rouge <span class="translation">Red</span></div>
        <div class="word-box bleu" onclick="playAudio('C2')">Bleu <span class="translation">Blue</span></div>
        <div class="word-box vert" onclick="playAudio('C3')">Vert <span class="translation">Green</span></div>
        <div class="word-box jaune" onclick="playAudio('C4')">Jaune <span class="translation">Yellow</span></div>
        <div class="word-box orange" onclick="playAudio('C5')">Orange <span class="translation">Orange</span></div>
        <div class="word-box noir" onclick="playAudio('C6')">Noir <span class="translation">Black</span></div>
        <div class="word-box blanc" onclick="playAudio('C7')">Blanc <span class="translation">White</span></div>
        <div class="word-box rose" onclick="playAudio('C8')">Rose <span class="translation">Pink</span></div>
        <div class="word-box violet" onclick="playAudio('C9')">Violet <span class="translation">Purple</span></div>
        <div class="word-box marron" onclick="playAudio('C10')">Marron <span class="translation">Brown</span></div>
    </div>
</div>

<script>
    function playAudio(word) {
        const audio = new Audio("Audio/Colours/" + word + ".mp3");
        audio.play().catch(e => console.log("Audio file not found: " + word + ".mp3"));
    }
</script>
</body>
</html>
