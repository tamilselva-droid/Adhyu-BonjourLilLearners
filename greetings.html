<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings - Learn French</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4facfe;
            --secondary: #ff9a9e;
            --accent: #ffe259;
            --dark: #333;
        }

        body {
            margin: 0;
            font-family: 'Baloo 2', cursive;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            min-height: 100vh;
            text-align: center;
        }

        /* Header layout matching Index.html */
        header {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            padding: 20px 15px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            flex: 1;
        }

        /* Reusable CTA button style from Index */
        .cta {
		  display: inline-block;
		  margin-top: 20px;
		  background: linear-gradient(90deg, #ff512f, #dd2476);
		  color: #fff;
		  padding: 10px 30px;
		  border-radius: 50px;
		  font-size: 1.1rem;
		  text-decoration: none;
		  box-shadow: 0 12px 25px rgba(0,0,0,0.3);
		  transition: transform 0.2s ease;
}

.cta-home {
            background: linear-gradient(90deg, #107CFE, #4facfe);
        }

        .cta:hover {
            transform: scale(1.05);
        }

header .cta + .cta {
    margin-left: 10px;
}
        .container {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .word-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .word-box {
            background-color: rgba(255, 255, 255, 0.8); /* See-through white */
            padding: 30px 20px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
        }

        .word-box:hover {
            background-color: #fff;
            transform: translateY(-5px);
            border-color: var(--secondary);
            color: #dd2476;
        }

        /* Placeholder to keep header balanced if one side is empty */
        .nav-spacer {
            width: 180px;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="cta cta-home">⬅ Back to Home</a>
    <h1>Salutations en français</h1>
    <a href="Greetings-quiz.html" class="cta">Take Quiz 🚀</a>
    <a href="Greetings-Game.html" class="cta">Play Game 🎲</a>
</header>

<div class="container">
    <div class="word-container">
        <div class="word-box" onclick="playAudio('1')">Bonjour <br><small>Hello</small></div>
        <div class="word-box" onclick="playAudio('2')">Au revoir <br><small>Goodbye</small></div>
        <div class="word-box" onclick="playAudio('3')">Salut <br><small>Hi</small></div>
        <div class="word-box" onclick="playAudio('4')">S'il vous plaît <br><small>Please</small></div>
        <div class="word-box" onclick="playAudio('5')">Merci <br><small>Thank you</small></div>
        <div class="word-box" onclick="playAudio('6')">Oui <br><small>Yes</small></div>
        <div class="word-box" onclick="playAudio('7')">Non <br><small>No</small></div>
        <div class="word-box" onclick="playAudio('8')">Bienvenue <br><small>Welcome</small></div>
        <div class="word-box" onclick="playAudio('9')">Excusez-moi <br><small>Excuse me</small></div>
        <div class="word-box" onclick="playAudio('10')">Bonne nuit <br><small>Good night</small></div>
    </div>
</div>

<script>
    function playAudio(word) {
        const audio = new Audio("Audio/Greetings/" + word + ".mp3");
        audio.play().catch(e => console.log("Audio file not found: " + word + ".mp3"));
    }
</script>

</body>
</html>
